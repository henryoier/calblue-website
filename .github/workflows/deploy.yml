name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test SWPL importer
        run: python3 -m unittest discover -s tests -v
      - name: Sync official SWPL schedule
        run: |
          curl --fail --silent --show-error --location \
            --header 'User-Agent: CalBlueScheduleSync/1.0 (+https://calbluefc.com/)' \
            'https://pacific.swplsoccer.com/teams/calblue-fc' \
            | python3 scripts/sync_swpl.py --source-file -
      - name: Validate site
        run: python3 scripts/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

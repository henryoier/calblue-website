name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject Supabase service credentials
        run: python3 scripts/check_secrets.py
      - name: Check database migration source and structure
        run: |
          python3 scripts/build_migrations.py --check
          python3 scripts/check_sql.py
      - name: Test schedule importers
        run: python3 -m unittest discover -s tests -v
      - name: Test player directory merging
        run: node tests/test_player_directory.js
      - name: Test competition and homepage schedules
        run: |
          node tests/test_competition_schedule.js
          node tests/test_homepage_schedule.js
          node tests/test_matchday_poster.js
          node tests/test_news_feed.js
      - name: Sync official SWPL schedule
        run: |
          curl --fail --silent --show-error --location \
            --header 'User-Agent: CalBlueScheduleSync/1.0 (+https://calbluefc.com/)' \
            'https://pacific.swplsoccer.com/teams/calblue-fc' \
            | python3 scripts/sync_swpl.py --source-file -
      - name: Sync official NCCSF schedule
        run: |
          nccsf_sync_dir=$(mktemp -d)
          trap 'rm -rf "$nccsf_sync_dir"' EXIT
          curl --fail --silent --show-error --location \
            --header 'Accept: application/json' \
            --header 'User-Agent: CalBlueScheduleSync/1.0 (+https://calbluefc.com/)' \
            --output "$nccsf_sync_dir/games.json" \
            'https://nccsf.org/en/league/game?a=ag&lid=36'
          curl --fail --silent --show-error --location \
            --header 'User-Agent: CalBlueScheduleSync/1.0 (+https://calbluefc.com/)' \
            --output "$nccsf_sync_dir/teams.html" \
            'https://nccsf.org/en/league/team?a=teams&lid=36'
          python3 scripts/sync_nccsf.py \
            --source-file "$nccsf_sync_dir/games.json" \
            --teams-file "$nccsf_sync_dir/teams.html"
      - name: Sync official competition rosters
        run: python3 scripts/sync_rosters.py
      - name: Sync club Instagram posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "IG_ACCESS_TOKEN secret not set; keeping the committed data/instagram.json"
            exit 0
          fi
          python3 scripts/sync_instagram.py --token "$IG_ACCESS_TOKEN" --limit 12 \
            || echo "::warning::Instagram sync failed; keeping the committed data/instagram.json"
      - name: Build club news feed
        run: python3 scripts/build_news.py
      - name: Validate site
        run: python3 scripts/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

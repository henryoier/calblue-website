name: Check database migrations

# Applies every migration to a throwaway local Supabase database inside the runner and runs the SQL
# checks in supabase/tests/. No hosted project is contacted and no secret is used.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRATCH_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a throwaway local database (Postgres and Auth only)
        run: |
          supabase --version
          psql --version
          mkdir -p "$RUNNER_TEMP/scratch" && cd "$RUNNER_TEMP/scratch"
          supabase init </dev/null
          supabase start --help | sed -n '/exclude/,+2p'
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,postgres-meta,supavisor,mailpit,postgrest,kong
          supabase status || true
          psql "$SCRATCH_DB" -X -A -t -c "select version()" -c "select 'auth tables: ' || string_agg(tablename, ', ' order by tablename) from pg_tables where schemaname = 'auth'" -c "select 'current_user ' || current_user || ', superuser ' || current_setting('is_superuser')"
      - name: Apply each migration to the empty database and run its checks
        run: python3 scripts/run_db_tests.py smoke --db-url "$SCRATCH_DB"
      - name: Start again from an empty database
        run: cd "$RUNNER_TEMP/scratch" && supabase db reset
      - name: Run the demo seed twice, then apply later migrations over its data
        run: python3 scripts/run_db_tests.py seed --db-url "$SCRATCH_DB"
      - name: Stop the local database
        if: always()
        run: cd "$RUNNER_TEMP/scratch" && supabase stop --no-backup || true

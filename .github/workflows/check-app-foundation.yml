name: Check app foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Enforce the no-build convention
        run: python3 scripts/check_no_build.py
      - name: Reject Supabase service credentials
        run: python3 scripts/check_secrets.py
      - name: Check SQL structure, staged access boundaries and RLS coverage
        run: python3 scripts/check_sql.py
      - name: Check generated migration matches its source
        run: python3 scripts/build_migrations.py --check
      - name: Check guarded disposable development seed
        run: python3 scripts/check_seed.py
      - name: Test Python checks and public-site logic
        run: python3 -m unittest discover -s tests -v
      - name: Test app JavaScript logic (existing Node, no packages)
        run: python3 scripts/run_js_tests.py
      - name: Test Auth and session lifecycle doubles (existing Node, no packages)
        run: python3 scripts/run_async_js_tests.py
      - name: Use Node 22 for browser-native cryptography tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test local club office encryption and accounting (Node 22+)
        run: node --test tests/club-office/*.test.mjs
      - name: Test account scoping and Google PKCE flow
        run: node --test tests/member-app/*.test.mjs
      - name: Validate the public site
        run: python3 scripts/check_site.py

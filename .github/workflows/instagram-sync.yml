name: Sync Instagram posts

# Manual run: imports the latest @calbluefc posts with the IG_ACCESS_TOKEN secret and uploads
# data/instagram.json plus the post images as a workflow artifact for a maintainer to commit.
# The regular deploy also runs the sync; this exists to refresh the committed snapshot and to
# test the token without deploying.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of recent posts to import
        default: '12'
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Import posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          test -n "$IG_ACCESS_TOKEN" || { echo "IG_ACCESS_TOKEN secret is not set"; exit 1; }
          python3 scripts/sync_instagram.py --token "$IG_ACCESS_TOKEN" --limit "${{ inputs.limit }}"
          python3 scripts/build_news.py
          python3 -m unittest tests.test_build_news -q
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: instagram-snapshot
          path: |
            data/instagram.json
            data/news.json
            assets/news/instagram/
          if-no-files-found: error

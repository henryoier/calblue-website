<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CalBlue — members</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>
  <nav id="app-nav" class="app-nav" aria-label="Members navigation"></nav>
  <main id="app" class="app-main" tabindex="-1">
    <div class="app-loading" role="status">Loading…</div>
  </main>
  <footer id="app-footer" class="app-footer"></footer>
  <script type="module">
    import { getClient, isConfigured } from "./js/supabase.js";
    import { initSession, getProfile, getRoles, onSessionChange } from "./js/session.js";
    import { createRouter } from "./js/router.js";
    import { renderLayout, renderLoading, renderError } from "./js/layout.js";
    import { homeView } from "./views/home.js";
    import { notFoundView } from "./views/not-found.js";
    import { signInView, signOutView } from "./views/sign-in.js";
    import { gamesView } from "./views/games.js";
    import { gameDetailView } from "./views/game-detail.js";
    import { identityView } from "./views/identity.js";
    import { verifyView } from "./views/verify.js";
    import { pickupNewView } from "./views/pickup-new.js";
    import { registerView } from "./views/register.js";
    import { checkInView } from "./views/check-in.js";
    import { CompetitionsView } from "./views/competitions.js";
    import { FixturesView } from "./views/fixtures.js";
    import { SeasonRosterView } from "./views/season-roster.js";
    import { FeesView } from "./views/fees.js";
    import { PaymentsView } from "./views/payments.js";
    import { StatementView } from "./views/statement.js";
    import { QuarterlyCloseView } from "./views/quarterly-close.js";
    import { CsvExportView } from "./views/csv-export.js";
    import { NotificationsView } from "./views/notifications.js";
    import { AuditView } from "./views/audit.js";
    import { ClubsView } from "./views/clubs.js";
    import { TournamentEntriesView } from "./views/tournament-entries.js";
    import { TournamentGroupsView } from "./views/tournament-groups.js";
    import { StandingsView } from "./views/standings.js";

    const headerEl = document.getElementById("app-header");
    const navEl = document.getElementById("app-nav");
    const mainEl = document.getElementById("app");
    const footerEl = document.getElementById("app-footer");

    const routes = [
      { pattern: "/", view: () => homeView(mainEl, { profile: getProfile(), roles: getRoles() }), title: "Home" },
      { pattern: "/sign-in", view: () => signInView(mainEl), title: "Sign in" },
      { pattern: "/sign-out", view: () => signOutView(mainEl), title: "Sign out" },
      { pattern: "/games", view: () => gamesView(mainEl, {}), title: "Games" },
      { pattern: "/games/:id", view: (params) => gameDetailView(mainEl, { gameId: params.id }), title: "Game detail" },
      { pattern: "/identity", view: () => identityView(mainEl), title: "My identity" },
      { pattern: "/admin/verify", view: () => verifyView(mainEl), title: "Verify players" },
      { pattern: "/games/new/pickup", view: () => pickupNewView(mainEl), title: "New pickup" },
      { pattern: "/games/:id/register", view: (params) => registerView(mainEl, { gameId: params.id }), title: "Register" },
      { pattern: "/games/:id/check-in", view: (params) => checkInView(mainEl, { gameId: params.id }), title: "Check-in" },
      { pattern: "/competitions", view: () => CompetitionsView(mainEl), title: "Competitions" },
      { pattern: "/competitions/:id/fixtures", view: () => FixturesView(mainEl), title: "Fixtures" },
      { pattern: "/competitions/:id/roster", view: () => SeasonRosterView(mainEl), title: "Season roster" },
      { pattern: "/admin/fees", view: () => FeesView(mainEl), title: "Fee schedules" },
      { pattern: "/admin/payments", view: () => PaymentsView(mainEl), title: "Payments" },
      { pattern: "/statement", view: () => StatementView(mainEl), title: "My statement" },
      { pattern: "/admin/quarterly-close", view: () => QuarterlyCloseView(mainEl), title: "Quarterly close" },
      { pattern: "/admin/csv-export", view: () => CsvExportView(mainEl), title: "CSV export" },
      { pattern: "/notifications", view: () => NotificationsView(mainEl), title: "Notifications" },
      { pattern: "/admin/audit", view: () => AuditView(mainEl), title: "Audit log" },
      { pattern: "/admin/clubs", view: () => ClubsView(mainEl), title: "Clubs & teams" },
      { pattern: "/tournament/entries", view: () => TournamentEntriesView(mainEl), title: "Tournament entries" },
      { pattern: "/tournament/groups", view: () => TournamentGroupsView(mainEl), title: "Groups & fixtures" },
      { pattern: "/standings", view: () => StandingsView(mainEl), title: "Standings" },
      { pattern: "*", view: () => notFoundView(mainEl), title: "Not found" },
    ];

    function updateChrome() {
      renderLayout({ headerEl, navEl, footerEl, roles: getRoles(), profile: getProfile(), supabaseConfigured: isConfigured() });
    }

    try {
      renderLoading(mainEl);
      const client = await getClient();
      await initSession(client);
      updateChrome();
      onSessionChange(updateChrome);
      const router = createRouter({ routes, mountPoint: mainEl });
      await router.render();
    } catch (err) {
      renderError(mainEl, err.message || String(err));
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CalBlue — members</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a id="app-skip" class="skip-link" href="#app">Skip to content</a>
  <header id="app-header" class="app-header"></header>
  <nav id="app-nav" class="app-nav" aria-label="Members navigation"></nav>
  <div id="app-status" class="app-status" hidden></div>
  <main id="app" class="app-main" tabindex="-1">
    <div class="app-loading" role="status">Starting members app…</div>
  </main>
  <footer id="app-footer" class="app-footer"></footer>
  <noscript><p class="app-main">The member app needs JavaScript. <a href="../">Visit the public site</a>.</p></noscript>
  <script type="module">
    // Report module-load failures too; do not leave a permanent loading screen.
    try {
      const { createApp } = await import("./js/app.js");
      await createApp().start();
    } catch (_) {
      const main = document.getElementById("app");
      main.textContent = "The member app could not start. Please reload the page.";
      main.setAttribute("role", "alert");
    }
  </script>
</body>
</html>

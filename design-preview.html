<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>CalBlue Design Preview</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #f5f8fa; background: #030b11; }
      header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 24px; background: rgba(3, 11, 17, .94); border-bottom: 1px solid rgba(255,255,255,.13); backdrop-filter: blur(12px); }
      h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; color: rgba(255,255,255,.55); font-size: 12px; }
      .preview-controls { display: flex; align-items: center; gap: 8px; }
      .preview-controls button, .preview-controls a { padding: 9px 13px; color: white; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); cursor: pointer; font: inherit; font-size: 12px; text-decoration: none; }
      .preview-controls button[aria-pressed="true"] { color: #061724; background: #d8ff3e; border-color: #d8ff3e; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 24px; padding: 24px; align-items: start; }
      section { min-width: 0; }
      h2 { display: flex; justify-content: space-between; margin: 0 0 12px; color: rgba(255,255,255,.72); font-size: 12px; letter-spacing: .13em; text-transform: uppercase; }
      h2 span { color: rgba(255,255,255,.35); font-weight: 400; }
      .frame-shell { overflow: hidden; background: #111c24; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 20px 60px rgba(0,0,0,.32); }
      .desktop-stage { position: relative; width: 100%; }
      iframe { display: block; border: 0; background: white; }
      .desktop-frame { position: absolute; inset: 0 auto auto 0; width: 1440px; height: 1000px; transform-origin: top left; }
      .mobile-shell { width: 390px; max-width: 100%; margin-inline: auto; }
      .mobile-frame { width: 390px; max-width: 100%; height: 844px; }
      @media (max-width: 1080px) { main { grid-template-columns: 1fr; } .mobile-shell { margin-left: 0; } }
      @media (max-width: 650px) { header { align-items: flex-start; flex-direction: column; } main { padding: 14px; } .preview-controls { flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>CalBlue Design Review</h1><p>Live desktop and mobile renderings from the same local build.</p></div>
      <div class="preview-controls" role="group" aria-label="Preview design">
        <button type="button" data-preview-design="codex-pro" aria-pressed="true">Codex Pro</button>
        <button type="button" data-preview-design="classic" aria-pressed="false">Classic</button>
        <a href="index.html?design=codex-pro" target="_blank">Open full page ↗</a>
      </div>
    </header>
    <main>
      <section>
        <h2>Desktop <span>1440 × 1000</span></h2>
        <div class="frame-shell desktop-stage" data-desktop-stage><iframe class="desktop-frame" data-preview-frame title="Desktop website preview"></iframe></div>
      </section>
      <section>
        <h2>Mobile <span>390 × 844</span></h2>
        <div class="frame-shell mobile-shell"><iframe class="mobile-frame" data-preview-frame title="Mobile website preview"></iframe></div>
      </section>
    </main>
    <script>
      const frames = [...document.querySelectorAll('[data-preview-frame]')];
      const buttons = [...document.querySelectorAll('[data-preview-design]')];
      const desktopStage = document.querySelector('[data-desktop-stage]');
      const desktopFrame = document.querySelector('.desktop-frame');

      const showDesign = (design) => {
        frames.forEach((frame) => { frame.src = `index.html?design=${design}`; });
        buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.previewDesign === design)));
      };
      const sizeDesktopPreview = () => {
        const scale = Math.min(desktopStage.clientWidth / 1440, 1);
        desktopFrame.style.transform = `scale(${scale})`;
        desktopStage.style.height = `${1000 * scale}px`;
      };

      buttons.forEach((button) => button.addEventListener('click', () => showDesign(button.dataset.previewDesign)));
      new ResizeObserver(sizeDesktopPreview).observe(desktopStage);
      sizeDesktopPreview();
      showDesign('codex-pro');
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>CalBlue Design Preview</title>
    <script src="designs/registry.js?v=20260826a"></script>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #f5f8fa; background: #030b11; }
      header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 24px; background: rgba(3, 11, 17, .94); border-bottom: 1px solid rgba(255,255,255,.13); backdrop-filter: blur(12px); }
      h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; color: rgba(255,255,255,.55); font-size: 12px; }
      .preview-controls, .preview-designs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      .preview-controls button, .preview-controls a, .preview-controls select { min-height: 38px; padding: 9px 13px; color: white; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); cursor: pointer; font: inherit; font-size: 12px; text-decoration: none; }
      .preview-controls button[aria-pressed="true"] { color: #061724; background: #ffc51b; border-color: #ffc51b; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 24px; padding: 24px; align-items: start; }
      section { min-width: 0; }
      h2 { display: flex; justify-content: space-between; margin: 0 0 12px; color: rgba(255,255,255,.72); font-size: 12px; letter-spacing: .13em; text-transform: uppercase; }
      h2 span { color: rgba(255,255,255,.35); font-weight: 400; }
      .frame-shell { overflow: hidden; background: #111c24; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 20px 60px rgba(0,0,0,.32); }
      .desktop-stage { position: relative; width: 100%; }
      iframe { display: block; border: 0; background: white; }
      .desktop-frame { position: absolute; inset: 0 auto auto 0; width: 1440px; height: 1000px; transform-origin: top left; }
      .mobile-shell { width: 390px; max-width: 100%; margin-inline: auto; }
      .mobile-frame { width: 390px; max-width: 100%; height: 844px; }
      @media (max-width: 1080px) { main { grid-template-columns: 1fr; } .mobile-shell { margin-left: 0; } }
      @media (max-width: 650px) { header { align-items: flex-start; flex-direction: column; } main { padding: 14px; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>CalBlue Design Review</h1><p>Compare all three redesigns and the original across desktop and mobile.</p></div>
      <div class="preview-controls">
        <select aria-label="Preview page" data-preview-page>
          <option value="index.html">Home</option>
          <option value="roster.html">Roster</option>
          <option value="gallery.html">Gallery</option>
          <option value="gallery-btg.html">BTG album</option>
        </select>
        <div class="preview-designs" data-preview-designs role="group" aria-label="Preview design"></div>
        <a href="index.html?design=codex-pro" target="_blank" rel="noopener" data-preview-open>Open full page ↗</a>
      </div>
    </header>
    <main>
      <section>
        <h2>Desktop <span>1440 × 1000</span></h2>
        <div class="frame-shell desktop-stage" data-desktop-stage><iframe class="desktop-frame" data-preview-frame title="Desktop website preview"></iframe></div>
      </section>
      <section>
        <h2>Mobile <span>390 × 844</span></h2>
        <div class="frame-shell mobile-shell"><iframe class="mobile-frame" data-preview-frame title="Mobile website preview"></iframe></div>
      </section>
    </main>
    <script>
      const designs = window.CALBLUE_DESIGNS.designs;
      const frames = [...document.querySelectorAll('[data-preview-frame]')];
      const designControls = document.querySelector('[data-preview-designs]');
      const pageControl = document.querySelector('[data-preview-page]');
      const desktopStage = document.querySelector('[data-desktop-stage]');
      const desktopFrame = document.querySelector('.desktop-frame');
      const openLink = document.querySelector('[data-preview-open]');
      const previewParams = new URLSearchParams(window.location.search);
      const requestedDesign = previewParams.get('design');
      const requestedPage = previewParams.get('page');
      let activeDesign = designs.some((design) => design.id === requestedDesign)
        ? requestedDesign
        : designs.some((design) => design.id === 'codex-pro') ? 'codex-pro' : designs[0].id;

      if ([...pageControl.options].some((option) => option.value === requestedPage)) {
        pageControl.value = requestedPage;
      }

      designs.forEach((design) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.previewDesign = design.id;
        button.textContent = `${design.agent} · ${design.name}`;
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => {
          activeDesign = design.id;
          renderPreview(true);
        });
        designControls.append(button);
      });

      const renderPreview = (preserveScroll = false) => {
        const page = pageControl.value;
        const previewUrl = `${page}?design=${encodeURIComponent(activeDesign)}&switcher=off`;
        const positions = frames.map((frame) => {
          try { return preserveScroll ? frame.contentWindow.scrollY : 0; } catch (error) { return 0; }
        });
        frames.forEach((frame, index) => {
          if (positions[index] > 0) {
            frame.addEventListener('load', () => {
              try { frame.contentWindow.scrollTo(0, positions[index]); } catch (error) { /* Same-origin preview fallback. */ }
            }, { once: true });
          }
          frame.src = previewUrl;
        });
        designControls.querySelectorAll('[data-preview-design]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.previewDesign === activeDesign));
        });
        openLink.href = `${page}?design=${encodeURIComponent(activeDesign)}`;
        const shareUrl = new URL(window.location.href);
        shareUrl.searchParams.set('design', activeDesign);
        shareUrl.searchParams.set('page', page);
        window.history.replaceState(null, '', shareUrl);
      };
      const sizeDesktopPreview = () => {
        const scale = Math.min(desktopStage.clientWidth / 1440, 1);
        desktopFrame.style.transform = `scale(${scale})`;
        desktopStage.style.height = `${1000 * scale}px`;
      };

      pageControl.addEventListener('change', () => renderPreview(false));
      new ResizeObserver(sizeDesktopPreview).observe(desktopStage);
      sizeDesktopPreview();
      renderPreview();
    </script>
  </body>
</html>
